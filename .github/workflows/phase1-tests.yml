name: Phase 1 Tests

on:
  push:
    paths:
      - ".github/workflows/phase1-tests.yml"
      - "bybit_xsreversal/**"
  pull_request:
    paths:
      - ".github/workflows/phase1-tests.yml"
      - "bybit_xsreversal/**"
  workflow_dispatch:

jobs:
  phase1-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bybit_xsreversal
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Phase 1 verification tests
        run: ./scripts/test_phase1.sh
